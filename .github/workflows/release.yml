name: Build signed APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing private signing key
        env:
          KEY_BASE64: ${{ secrets.CLASSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_BASE64" ]; then
            echo 'Add CLASSIC_KEYSTORE_BASE64 in repository Actions secrets. A new key cannot update existing installations.'
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/classic.keystore"
          chmod 600 "$RUNNER_TEMP/classic.keystore"
      - run: python fork-build/bootstrap.py
      - run: pip install androguard==4.1.3
      - name: Build with the same signing identity
        env:
          CLASSIC_KEYSTORE: ${{ runner.temp }}/classic.keystore
          CLASSIC_KEY_ALIAS: ${{ secrets.CLASSIC_KEY_ALIAS }}
          CLASSIC_STORE_PASSWORD: ${{ secrets.CLASSIC_STORE_PASSWORD }}
          CLASSIC_KEY_PASSWORD: ${{ secrets.CLASSIC_KEY_PASSWORD }}
        run: python fork-build/build.py --release
      - run: python fork-build/validate.py
      - name: Verify certificate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(python -c 'import json; print("Twitch-Classic-"+json.load(open("fork-build/version.json"))["name"]+".apk")')"
          TAG="$(python -c 'import json; print("v"+json.load(open("fork-build/version.json"))["name"])')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then exit 1; fi
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -F '95ae6fe54cd368ee2b8826d977edc86f880eb274f8a75fdcfe047e150602149d' "$RUNNER_TEMP/signature.txt"
          sha256sum "$APK" > SHA256SUMS
          gh release create "$TAG" "$APK" SHA256SUMS fork-build/out/classic-source.zip --target "$GITHUB_SHA" --title "Twitch Classic ${TAG#v}" --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/classic.keystore"
